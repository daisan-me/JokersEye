name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_floor_plan.cjs
      - run: node tests/test-source-readiness.cjs
      - run: node tests/test_juggler_preparation.cjs
      - run: node --test tests/test_juggler_math.cjs
        env:
          PYTHON: python
